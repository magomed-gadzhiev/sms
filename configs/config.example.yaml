# Пример конфигурационного файла для SMPP сервера
# Скопируйте этот файл в config.yaml и настройте под ваше окружение
# Или используйте переменные окружения с префиксом SMPP_

service:
  name: smpp-server
  version: 1.0.0
  env: development # development, staging, production

database:
  host: localhost
  port: 5432
  user: smpp
  password: smpp_password
  database: smpp_db
  ssl_mode: disable
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m
  conn_max_idle_time: 10m

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 5
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

kafka:
  brokers:
    - localhost:9092
  topic_outgoing: sms.outgoing
  topic_dlr: sms.dlr
  topic_failed: sms.failed
  consumer_group: smpp-worker
  session_timeout: 30s
  heartbeat_interval: 10s
  max_retries: 3
  retry_backoff: 1s

smpp:
  host: 0.0.0.0
  port: 2775
  read_timeout: 30s
  write_timeout: 30s
  enquire_link_period: 60s
  max_connections: 1000
  rate_limit_per_sec: 100

api:
  http:
    host: 0.0.0.0
    port: 8080
    read_timeout: 10s
    write_timeout: 10s
    idle_timeout: 120s
  grpc:
    host: 0.0.0.0
    port: 9090
    max_recv: 4194304  # 4MB
    max_send: 4194304  # 4MB
  auth:
    api_key_header: X-API-Key
    jwt_secret: ""
    token_expiry: 24h

worker:
  concurrency: 10
  max_retries: 5
  retry_backoff_base: 1s
  retry_backoff_max: 60s
  batch_size: 100
  batch_timeout: 5s
  health_check_period: 30s

scheduler:
  interval: 10s
  batch_size: 100
  stuck_threshold: 5m

dlr_expiry:
  timeout: 24h        # Таймаут ожидания DLR перед переводом в статус expired
  check_interval: 5m  # Интервал проверки истёкших сообщений
  batch_size: 500      # Размер пакета для обработки

data_retention:
  messages_days: 90    # Срок хранения данных сообщений (дни)
  audit_days: 365      # Срок хранения логов аудита (дни)
  purge_interval: 24h  # Интервал запуска очистки

monitoring:
  enabled: true
  prometheus:
    enabled: true
    path: /metrics
  metrics_port: 2112
