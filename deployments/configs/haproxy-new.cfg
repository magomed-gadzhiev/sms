global
    log stdout format raw local0
    maxconn 4096
    daemon

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    option forwardfor

# Stats endpoint
listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 30s
    stats admin if TRUE

# Client Gateway HTTP frontend
frontend client_http_frontend
    bind *:8080
    mode http
    default_backend client_http_backend

# Admin Gateway HTTP frontend
frontend admin_http_frontend
    bind *:8081
    mode http
    default_backend admin_http_backend

# Client Gateway gRPC frontend
frontend client_grpc_frontend
    bind *:9090
    mode tcp
    default_backend client_grpc_backend

# Admin Gateway gRPC frontend
frontend admin_grpc_frontend
    bind *:9091
    mode tcp
    default_backend admin_grpc_backend

# Client Gateway HTTP backend
backend client_http_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server client1 client-gateway-1:8080 check inter 5s fall 3 rise 2
    server client2 client-gateway-2:8080 check inter 5s fall 3 rise 2

# Admin Gateway HTTP backend
backend admin_http_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server admin1 admin-gateway-1:8081 check inter 5s fall 3 rise 2
    server admin2 admin-gateway-2:8081 check inter 5s fall 3 rise 2

# Client Gateway gRPC backend
backend client_grpc_backend
    mode tcp
    balance roundrobin
    option tcp-check
    tcp-check connect
    server client1 client-gateway-1:9090 check inter 5s fall 3 rise 2
    server client2 client-gateway-2:9090 check inter 5s fall 3 rise 2

# Admin Gateway gRPC backend
backend admin_grpc_backend
    mode tcp
    balance roundrobin
    option tcp-check
    tcp-check connect
    server admin1 admin-gateway-1:9091 check inter 5s fall 3 rise 2
    server admin2 admin-gateway-2:9091 check inter 5s fall 3 rise 2

# Portal Gateway HTTP frontend
frontend portal_http_frontend
    bind *:8082
    mode http
    default_backend portal_http_backend

# Portal Frontend HTTP frontend
frontend portal_frontend_frontend
    bind *:8083
    mode http
    default_backend portal_frontend_backend

# Portal Gateway HTTP backend
backend portal_http_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server portal1 portal-gateway:8082 check inter 5s fall 3 rise 2

# Portal Frontend HTTP backend
backend portal_frontend_backend
    mode http
    balance roundrobin
    option httpchk GET /
    http-check expect status 200
    server frontend1 portal-frontend:80 check inter 5s fall 3 rise 2
