# Plan 6 Task 5 — defense in depth поверх requirepass + 127.0.0.1 host bind.
protected-mode yes
bind 0.0.0.0
port 6379
appendonly yes
# timeout 0 = no server-side idle close. Защита от forgotten connections —
# на стороне клиента: go-redis/v9 PubSub.Channel() имеет встроенный
# HealthCheckInterval=3s, который шлёт PING для detect/reconnect, но он
# defends client-side health, не сервер. Если выставить timeout > 0,
# любой code path использующий PubSub.Receive() напрямую (без Channel())
# или другие long-idle connections без heartbeat будет silently разорван
# сервером без error notification. Defense-in-depth value небольшой
# (forgotten connections), risk реальный — выбираем 0.
timeout 0
# Лимит TCP backlog — соответствует Linux default.
tcp-backlog 511
# Note: requirepass проставляется через CLI flag в docker-compose, не здесь
# (env-переменная подменяется в command:, а conf-файл статичен).
