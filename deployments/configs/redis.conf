# Plan 6 Task 5 — defense in depth поверх requirepass + 127.0.0.1 host bind.
protected-mode yes
bind 0.0.0.0
port 6379
appendonly yes
# Прерывать idle-клиентов через 5 минут (защита от forgotten connections).
timeout 300
# Лимит TCP backlog — соответствует Linux default.
tcp-backlog 511
# Note: requirepass проставляется через CLI flag в docker-compose, не здесь
# (env-переменная подменяется в command:, а conf-файл статичен).
