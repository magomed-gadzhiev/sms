# deployments/configs/postgresql.conf
# LOW-MEMORY mode — for dev/testing, not for high-load
# Original (production): shared_buffers=4GB, effective_cache_size=12GB, work_mem=64MB

# Memory
shared_buffers = 256MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 64MB
wal_buffers = 16MB

# WAL & Checkpoints
min_wal_size = 256MB
max_wal_size = 1GB
checkpoint_completion_target = 0.9

# Write Performance — async commit, Kafka is source of truth
synchronous_commit = off
wal_writer_delay = 200ms
commit_delay = 100

# Parallelism
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4

# Connections — PgBouncer handles pooling
listen_addresses = '*'
max_connections = 100
