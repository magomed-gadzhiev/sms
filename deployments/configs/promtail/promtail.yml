server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: status
            values: ["running"]
    relabel_configs:
      # Strip leading "/" from container name
      - source_labels: [__meta_docker_container_name]
        regex: '/?(.+)'
        target_label: container
      # Derive service name: strip "deployments-" prefix and trailing "-N" replica suffix
      - source_labels: [__meta_docker_container_name]
        regex: '/?(?:deployments-)?(.*?)(?:-\d+)?$'
        target_label: service
        replacement: '${1}'
    pipeline_stages:
      # Parse the JSON log line
      - json:
          expressions:
            level: level
            component: component
            trace_id: trace_id
            message_id: message_id
            stage: stage
            event: event
            kafka_wait_ms: kafka_wait_ms
            processing_ms: processing_ms
      # Promote level and component to Loki stream labels for filtering
      - labels:
          level:
          component:
      # Drop debug logs to reduce storage
      - match:
          selector: '{level="debug"}'
          action: drop
