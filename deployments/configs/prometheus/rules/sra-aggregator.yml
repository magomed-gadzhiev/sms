groups:
  - name: sra-aggregator
    # interval inherits global evaluation_interval (15s) — критичный SRARetryPanic
    # должен fire'ить в течение 15 секунд от первого panic'а, не 1 минуты.
    rules:
      # SRA-row застряла в give-up (manual ops attention требуется).
      - alert: SRARetryGiveUpRows
        expr: portal_sra_retry_give_up_count > 0
        for: 10m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "{{ $value }} SRA rows reached retry-cap=100"
          description: |
            Subaccount routing assignment row(s) have materialize_retry_count >= 100
            and are no longer auto-retried. Check /admin/sra-stuck in portal,
            investigate root cause, then click Reset to resume retries.
          runbook: "https://internal/runbooks/sra-stuck"

      # Initial-failure rate — split per-env (prod traffic ~2 порядка > sandbox).
      # Prod threshold 0.05 events/sec (~3/min) — real degradation signal.
      - alert: SRAMaterializeInitialFailureRateProd
        expr: rate(portal_materialize_failure_total{source="initial"}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          team: ops
          env: prod
        annotations:
          summary: "[prod] SRA materialize initial-failure rate > 0.05 events/sec (~3/min)"
          description: |
            Materializer ApplyToClient failures during PUT/Bulk handlers
            (operation={{ $labels.operation }}). Rate {{ printf "%.2f" $value }}/sec.
            Check portal-gateway logs for errors. retry-loop will pick these up
            within 1 minute (cap=100).
        # ВАЖНО: alert match'ит ЛЮБОЙ env (prod/sandbox/etc), но routes/inhibits
        # в Alertmanager используют label `env: prod` для prod-receiver.
        # На sandbox этот alert тоже fire'ится при > 0.05/s, но Alertmanager
        # routing (Task 9) направит его в log-only (env=sandbox match'ится первым).

      - alert: SRAMaterializeInitialFailureRateSandbox
        expr: rate(portal_materialize_failure_total{source="initial"}[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
          team: ops
          env: sandbox
        annotations:
          summary: "[sandbox] SRA materialize initial-failure rate > 0.5 events/sec (10x prod threshold)"
          description: |
            Sandbox 10x prod threshold — игнорируем ниже этого порога (тестовый
            traffic с ad-hoc провайдер-конфигами генерирует false positives).

      # Backlog overflow — sustained sign that retry tick capacity недостаточна.
      - alert: SRARetryBacklogOverflow
        expr: rate(portal_sra_retry_backlog_overflow_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "SRA retry backlog overflowing"
          description: |
            RetryPendingOnce reached LIMIT 100 batch in last 15 min. Pending
            queue exceeds tick capacity (1m * 100 = 6000/h ceiling). Possible
            causes: bulk-failure event, slow materializer, or stuck rows
            accumulating below cap. Check portal_sra_pending_retry_count gauge.

      # Panic в retry-loop — signal hard failure (per-row recover, но возможен общий тренд).
      - alert: SRARetryPanic
        expr: increase(portal_materialize_failure_total{operation="retry_panic"}[15m]) > 0
        for: 0m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "Panic в SRA retry-loop"
          description: |
            Per-row defer/recover поймал panic в materializer. Loop продолжает
            работу, но это hard signal — типично nil-deref в pgx Scan или
            corrupted DB state. Проверь worker logs за последние 15 минут.
