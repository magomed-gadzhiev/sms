apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    access: proxy
    isDefault: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id":"([^"]+)"'
          url: '/explore?orgId=1&left={"datasource":"loki","queries":[{"expr":"{service=~\"pipeline-.*\"} | json | trace_id=\"${__value.raw}\"","refId":"A"}],"range":{"from":"now-1h","to":"now"}}'
          urlDisplayLabel: "Trace pipeline"
