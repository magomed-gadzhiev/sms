global
    log stdout format raw local0
    maxconn 4096
    daemon

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    option forwardfor

# Stats endpoint
listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 30s
    stats admin if TRUE

# HTTP API frontend
frontend http_frontend
    bind *:8080
    mode http
    default_backend http_backend

# gRPC frontend
frontend grpc_frontend
    bind *:9090
    mode tcp
    default_backend grpc_backend

# HTTP backend
backend http_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server api1 api-gateway-1:8080 check inter 5s fall 3 rise 2
    server api2 api-gateway-2:8080 check inter 5s fall 3 rise 2

# gRPC backend
backend grpc_backend
    mode tcp
    balance roundrobin
    option tcp-check
    tcp-check connect
    server api1 api-gateway-1:9090 check inter 5s fall 3 rise 2
    server api2 api-gateway-2:9090 check inter 5s fall 3 rise 2
