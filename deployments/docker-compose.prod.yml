# Production overlay. Применять:
# docker compose -f deployments/docker-compose.yml -f deployments/docker-compose.prod.yml --env-file deployments/.env.prod up -d
#
# Sandbox compose (без -f docker-compose.prod.yml) этот overlay НЕ подцепляет
# и продолжает работать как раньше (publish 18084 для portal-gateway).
#
# REQUIREMENTS:
# - Docker Compose >= 2.24 (для !reset директивы — иначе portal-gateway publish
#   18084 НЕ снимется и portal будет доступен мимо TLS-фронта). Verify до
#   первого `up`: `docker compose version`.
# - DNS A/AAAA для $PORTAL_DOMAIN указывает на VM IP (требование для Let's
#   Encrypt HTTP-01). Без DNS caddy зависает в ACME-loop.
services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./configs/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # ${VAR:?msg} — fail-fast если переменная пустая или unset; иначе caddy
    # парсит Caddyfile с literal "{$PORTAL_DOMAIN}" → синтакс-ошибка не очевидна.
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?PORTAL_DOMAIN must be set in .env.prod}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?LETSENCRYPT_EMAIL must be set in .env.prod}
    depends_on:
      - portal-gateway
    networks:
      - smpp-network

  # Portal-gateway: убираем publish 18084 наружу — теперь только internal,
  # доступ через caddy. Если в будущем portal-gateway получит /healthz endpoint
  # на отдельном порту — published can be добавлен здесь.
  portal-gateway:
    ports: !reset []

volumes:
  caddy_data:
  caddy_config:
