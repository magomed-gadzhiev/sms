<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SMS Portal</title>
    <script>
      // FOUC-prevention: apply theme class before React mounts.
      // Mirrors ThemeContext logic; kept in sync manually.
      (function () {
        try {
          var m = localStorage.getItem('portal-theme-mode') || 'system';
          var dark = m === 'dark' ||
            (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) { /* localStorage blocked — fall through */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
