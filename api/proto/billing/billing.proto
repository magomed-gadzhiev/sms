syntax = "proto3";

package billing.v1;

option go_package = "github.com/smpp-server/smpp-server/api/proto/billingv1";

import "google/protobuf/timestamp.proto";

// BillingService предоставляет методы для работы с биллингом
service BillingService {
  // GetBalance получает баланс клиента
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
  
  // ChargeMessage списывает средства за сообщение
  rpc ChargeMessage(ChargeMessageRequest) returns (ChargeMessageResponse);
  
  // AddCredits добавляет средства на счет клиента
  rpc AddCredits(AddCreditsRequest) returns (AddCreditsResponse);
  
  // DeductCredits списывает средства со счета клиента
  rpc DeductCredits(DeductCreditsRequest) returns (DeductCreditsResponse);
  
  // GetTransactionHistory получает историю транзакций
  rpc GetTransactionHistory(GetTransactionHistoryRequest) returns (GetTransactionHistoryResponse);
  
  // GetPricingRules получает правила тарификации для клиента
  rpc GetPricingRules(GetPricingRulesRequest) returns (GetPricingRulesResponse);
  
  // CreatePricingRule создает правило тарификации
  rpc CreatePricingRule(CreatePricingRuleRequest) returns (CreatePricingRuleResponse);

  // TransferBalance переводит средства между клиентами
  rpc TransferBalance(TransferBalanceRequest) returns (TransferBalanceResponse);

  // FreezeAccount замораживает счет клиента
  rpc FreezeAccount(FreezeAccountRequest) returns (FreezeAccountResponse);

  // UnfreezeAccount размораживает счет клиента
  rpc UnfreezeAccount(UnfreezeAccountRequest) returns (UnfreezeAccountResponse);

  // SetCreditLimit устанавливает кредитный лимит для клиента
  rpc SetCreditLimit(SetCreditLimitRequest) returns (SetCreditLimitResponse);

  // SetLowBalanceThreshold устанавливает порог низкого баланса
  rpc SetLowBalanceThreshold(SetLowBalanceThresholdRequest) returns (SetLowBalanceThresholdResponse);

  // ListBalances получает список балансов с фильтрацией
  rpc ListBalances(ListBalancesRequest) returns (ListBalancesResponse);
}

// GetBalanceRequest представляет запрос на получение баланса
message GetBalanceRequest {
  string client_id = 1;           // ID клиента
}

// GetBalanceResponse представляет ответ с балансом
message GetBalanceResponse {
  string client_id = 1;           // ID клиента
  string balance = 2;             // Баланс (в виде строки для точности)
  string currency = 3;            // Валюта (по умолчанию "RUB")
  google.protobuf.Timestamp updated_at = 4;  // Время последнего обновления
  bool frozen = 5;                            // Заморожен ли счет
  string credit_limit = 6;                    // Кредитный лимит
}

// ChargeMessageRequest представляет запрос на списание за сообщение
message ChargeMessageRequest {
  string client_id = 1;           // ID клиента
  string message_id = 2;          // ID сообщения
  string amount = 3;              // Сумма за один сегмент
  string currency = 4;            // Валюта (по умолчанию "RUB")
  string description = 5;         // Описание транзакции
  int32 segment_count = 6;        // Количество сегментов (умножается на amount)
}

// ChargeMessageResponse представляет ответ на списание
message ChargeMessageResponse {
  string transaction_id = 1;      // ID транзакции
  string new_balance = 2;         // Новый баланс
  bool success = 3;               // Успешность операции
  string error = 4;               // Ошибка (если неуспешно)
}

// AddCreditsRequest представляет запрос на добавление средств
message AddCreditsRequest {
  string client_id = 1;           // ID клиента
  string amount = 2;              // Сумма для добавления
  string currency = 3;            // Валюта (по умолчанию "RUB")
  string description = 4;         // Описание транзакции
  string payment_method = 5;      // Способ оплаты (опционально)
}

// AddCreditsResponse представляет ответ на добавление средств
message AddCreditsResponse {
  string transaction_id = 1;      // ID транзакции
  string new_balance = 2;         // Новый баланс
  bool success = 3;               // Успешность операции
  string error = 4;               // Ошибка (если неуспешно)
}

// DeductCreditsRequest представляет запрос на списание средств
message DeductCreditsRequest {
  string client_id = 1;           // ID клиента
  string amount = 2;              // Сумма для списания
  string currency = 3;            // Валюта (по умолчанию "RUB")
  string description = 4;         // Описание транзакции
}

// DeductCreditsResponse представляет ответ на списание средств
message DeductCreditsResponse {
  string transaction_id = 1;      // ID транзакции
  string new_balance = 2;         // Новый баланс
  bool success = 3;               // Успешность операции
  string error = 4;               // Ошибка (если неуспешно)
}

// GetTransactionHistoryRequest представляет запрос на получение истории транзакций
message GetTransactionHistoryRequest {
  string client_id = 1;           // ID клиента
  google.protobuf.Timestamp from = 2;  // Начало периода (опционально)
  google.protobuf.Timestamp to = 3;    // Конец периода (опционально)
  string transaction_type = 4;    // Тип транзакции (charge, credit, refund) (опционально)
  int32 limit = 5;                // Лимит записей
  int32 offset = 6;               // Смещение для пагинации
}

// GetTransactionHistoryResponse представляет ответ с историей транзакций
message GetTransactionHistoryResponse {
  repeated Transaction transactions = 1;  // Список транзакций
  int32 total = 2;                // Общее количество
  int32 limit = 3;                // Лимит записей
  int32 offset = 4;               // Смещение
}

// GetPricingRulesRequest представляет запрос на получение правил тарификации
message GetPricingRulesRequest {
  string client_id = 1;           // ID клиента
}

// GetPricingRulesResponse представляет ответ с правилами тарификации
message GetPricingRulesResponse {
  repeated PricingRule rules = 1; // Список правил тарификации
}

// CreatePricingRuleRequest представляет запрос на создание правила тарификации
message CreatePricingRuleRequest {
  string client_id = 1;           // ID клиента (пусто для глобального правила)
  string destination_pattern = 2; // Паттерн номера получателя (regex)
  string price_per_message = 3;   // Цена за сообщение
  string currency = 4;            // Валюта (по умолчанию "RUB")
  int32 priority = 5;             // Приоритет правила
  bool active = 6;                // Активно ли правило
}

// CreatePricingRuleResponse представляет ответ на создание правила тарификации
message CreatePricingRuleResponse {
  string rule_id = 1;             // ID созданного правила
  google.protobuf.Timestamp created_at = 2;  // Время создания
}

// Transaction представляет транзакцию
message Transaction {
  string transaction_id = 1;      // ID транзакции
  string client_id = 2;           // ID клиента
  string type = 3;                // Тип транзакции (charge, credit, refund)
  string amount = 4;              // Сумма
  string currency = 5;            // Валюта
  string balance_before = 6;      // Баланс до транзакции
  string balance_after = 7;       // Баланс после транзакции
  string description = 8;         // Описание
  string message_id = 9;          // ID сообщения (если связано)
  google.protobuf.Timestamp created_at = 10; // Время создания
  int32 segment_count = 11;       // Количество сегментов SMS
}

// PricingRule представляет правило тарификации
message PricingRule {
  string rule_id = 1;             // ID правила
  string client_id = 2;           // ID клиента (пусто для глобального правила)
  string destination_pattern = 3; // Паттерн номера получателя
  string price_per_message = 4;   // Цена за сообщение
  string currency = 5;            // Валюта
  int32 priority = 6;             // Приоритет правила
  bool active = 7;                // Активно ли правило
  google.protobuf.Timestamp created_at = 8;  // Время создания
  google.protobuf.Timestamp updated_at = 9;  // Время обновления
}

// TransferBalanceRequest представляет запрос на перевод средств между клиентами
message TransferBalanceRequest {
  string from_client_id = 1;      // ID клиента-отправителя
  string to_client_id = 2;        // ID клиента-получателя
  string amount = 3;              // Сумма перевода (в виде строки для точности)
  string currency = 4;            // Валюта
}

// TransferBalanceResponse представляет ответ на перевод средств
message TransferBalanceResponse {
  string transfer_id = 1;         // ID перевода
  string from_balance = 2;        // Баланс отправителя после перевода
  string to_balance = 3;          // Баланс получателя после перевода
}

message FreezeAccountRequest {
  string client_id = 1;
  string admin_id = 2;
}

message FreezeAccountResponse {
  bool success = 1;
  google.protobuf.Timestamp frozen_at = 2;
}

message UnfreezeAccountRequest {
  string client_id = 1;
  string admin_id = 2;
}

message UnfreezeAccountResponse {
  bool success = 1;
}

message SetCreditLimitRequest {
  string client_id = 1;
  string credit_limit = 2;
}

message SetCreditLimitResponse {
  bool success = 1;
  string credit_limit = 2;
}

message SetLowBalanceThresholdRequest {
  string client_id = 1;
  string threshold = 2;
}

message SetLowBalanceThresholdResponse {
  bool success = 1;
  string threshold = 2;
}

message ListBalancesRequest {
  string search = 1;
  string status = 2;
  bool below_threshold = 3;
  int32 limit = 4;
  int32 offset = 5;
}

message BalanceInfo {
  string client_id = 1;
  string client_name = 2;
  string balance = 3;
  string currency = 4;
  bool frozen = 5;
  string credit_limit = 6;
  string low_balance_threshold = 7;
  google.protobuf.Timestamp frozen_at = 8;
  string frozen_by = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message ListBalancesResponse {
  repeated BalanceInfo balances = 1;
  int32 total = 2;
  int32 limit = 3;
  int32 offset = 4;
}
