syntax = "proto3";

package provider.v1;

option go_package = "github.com/smpp-server/smpp-server/api/proto/providerv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// ProviderService предоставляет методы для управления SMSC провайдерами
service ProviderService {
  // CreateProvider создает нового провайдера
  rpc CreateProvider(CreateProviderRequest) returns (CreateProviderResponse);

  // UpdateProvider обновляет провайдера
  rpc UpdateProvider(UpdateProviderRequest) returns (UpdateProviderResponse);

  // GetProvider получает информацию о провайдере
  rpc GetProvider(GetProviderRequest) returns (GetProviderResponse);

  // ListProviders получает список провайдеров
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse);

  // DeleteProvider удаляет провайдера
  rpc DeleteProvider(DeleteProviderRequest) returns (DeleteProviderRequest);

  // GetProviderHealth получает статус здоровья провайдера
  rpc GetProviderHealth(GetProviderHealthRequest) returns (GetProviderHealthResponse);

  // SendToProvider отправляет сообщение через провайдера
  rpc SendToProvider(SendToProviderRequest) returns (SendToProviderResponse);

  // ---- Client-Provider RPC ----
  rpc CreateClientProvider(CreateClientProviderRequest) returns (ClientProvider);
  rpc ListClientProviders(ListClientProvidersRequest) returns (ListClientProvidersResponse);
  rpc GetClientProvider(GetClientProviderRequest) returns (ClientProvider);
  rpc UpdateClientProvider(UpdateClientProviderRequest) returns (ClientProvider);
  rpc DeleteClientProvider(DeleteClientProviderRequest) returns (google.protobuf.Empty);
  rpc TestClientProviderConnection(TestConnectionRequest) returns (TestConnectionResponse);
}

// CreateProviderRequest представляет запрос на создание провайдера
message CreateProviderRequest {
  string name = 1;                // Название провайдера
  string host = 2;                // Хост SMSC
  int32 port = 3;                 // Порт SMSC
  string system_id = 4;           // System ID для bind
  string password = 5;            // Пароль для bind
  string system_type = 6;         // System Type (опционально)
  int32 addr_ton = 7;             // Address TON (опционально)
  int32 addr_npi = 8;             // Address NPI (опционально)
  int32 bind_type = 9;            // Тип bind (1=TX, 2=RX, 3=TRX)
  int32 max_connections = 10;     // Максимальное количество соединений
  int32 window_size = 11;         // Размер окна (опционально)
  bool active = 12;               // Активен ли провайдер
  map<string, string> settings = 13;  // Дополнительные настройки
}

// CreateProviderResponse представляет ответ на создание провайдера
message CreateProviderResponse {
  string provider_id = 1;         // ID созданного провайдера
  google.protobuf.Timestamp created_at = 2;  // Время создания
}

// UpdateProviderRequest представляет запрос на обновление провайдера
message UpdateProviderRequest {
  string provider_id = 1;         // ID провайдера
  string name = 2;                // Название провайдера (опционально)
  string host = 3;                // Хост SMSC (опционально)
  int32 port = 4;                 // Порт SMSC (опционально)
  string system_id = 5;           // System ID (опционально)
  string password = 6;            // Пароль (опционально)
  int32 max_connections = 7;      // Максимальное количество соединений (опционально)
  bool active = 8;                // Активен ли провайдер (опционально)
  map<string, string> settings = 9;  // Дополнительные настройки (опционально)
}

// UpdateProviderResponse представляет ответ на обновление провайдера
message UpdateProviderResponse {
  bool success = 1;               // Успешность операции
}

// GetProviderRequest представляет запрос на получение провайдера
message GetProviderRequest {
  string provider_id = 1;         // ID провайдера
}

// GetProviderResponse представляет ответ с информацией о провайдере
message GetProviderResponse {
  ProviderInfo provider = 1;      // Информация о провайдере
}

// ListProvidersRequest представляет запрос на получение списка провайдеров
message ListProvidersRequest {
  bool active_only = 1;           // Только активные провайдеры
  int32 limit = 2;                // Лимит записей
  int32 offset = 3;               // Смещение для пагинации
}

// ListProvidersResponse представляет ответ со списком провайдеров
message ListProvidersResponse {
  repeated ProviderInfo providers = 1;  // Список провайдеров
  int32 total = 2;                // Общее количество
}

// DeleteProviderRequest представляет запрос на удаление провайдера
message DeleteProviderRequest {
  string provider_id = 1;         // ID провайдера
}

// GetProviderHealthRequest представляет запрос на получение статуса здоровья
message GetProviderHealthRequest {
  string provider_id = 1;         // ID провайдера
}

// GetProviderHealthResponse представляет ответ со статусом здоровья
message GetProviderHealthResponse {
  string provider_id = 1;         // ID провайдера
  string status = 2;              // Статус (healthy, unhealthy, degraded)
  int32 active_connections = 3;   // Количество активных соединений
  int32 total_connections = 4;    // Общее количество соединений
  int32 success_rate = 5;         // Процент успешных отправок (0-100)
  int64 messages_sent_24h = 6;    // Количество отправленных сообщений за 24 часа
  int64 messages_failed_24h = 7;  // Количество неудачных сообщений за 24 часа
  google.protobuf.Timestamp last_success = 8;  // Время последней успешной отправки
  google.protobuf.Timestamp last_failure = 9;  // Время последней неудачи
  string last_error = 10;         // Последняя ошибка (опционально)
}

// SendToProviderRequest представляет запрос на отправку через провайдера
message SendToProviderRequest {
  string provider_id = 1;         // ID провайдера
  string message_id = 2;          // ID сообщения
  string source = 3;              // Отправитель
  string destination = 4;         // Получатель
  string text = 5;                // Текст сообщения
  map<string, string> smpp_params = 6;  // Дополнительные SMPP параметры
}

// SendToProviderResponse представляет ответ на отправку
message SendToProviderResponse {
  bool success = 1;               // Успешность отправки
  string smpp_message_id = 2;     // SMPP message ID (если успешно)
  string error = 3;               // Ошибка (если неуспешно)
}

// ProviderInfo представляет информацию о провайдере
message ProviderInfo {
  string provider_id = 1;         // ID провайдера
  string name = 2;                // Название провайдера
  string host = 3;                // Хост SMSC
  int32 port = 4;                 // Порт SMSC
  string system_id = 5;           // System ID
  string system_type = 6;         // System Type
  int32 bind_type = 7;            // Тип bind
  int32 max_connections = 8;      // Максимальное количество соединений
  int32 window_size = 9;          // Размер окна
  bool active = 10;               // Активен ли провайдер
  map<string, string> settings = 11;  // Дополнительные настройки
  google.protobuf.Timestamp created_at = 12;  // Время создания
  google.protobuf.Timestamp updated_at = 13;  // Время обновления
}

// ---- Client-Provider messages ----

message RoutingRule {
  string pattern  = 1;
  int32  priority = 2;
}

message ClientProvider {
  string id              = 1;
  string client_id       = 2;
  string name            = 3;
  string description     = 4;
  repeated string tags   = 5;
  string host            = 6;
  int32  port            = 7;
  string system_id       = 8;
  int32  bind_type       = 9;
  int32  window_size     = 10;
  int32  max_connections = 11;
  int32  tps_limit       = 12;
  bool   active          = 13;
  repeated RoutingRule routing_rules = 14;
  string created_at      = 15;
  string updated_at      = 16;
}

message CreateClientProviderRequest {
  string client_id       = 1;
  string name            = 2;
  string description     = 3;
  repeated string tags   = 4;
  string host            = 5;
  int32  port            = 6;
  string system_id       = 7;
  string password        = 8;
  int32  bind_type       = 9;
  int32  window_size     = 10;
  int32  max_connections = 11;
  int32  tps_limit       = 12;
  repeated RoutingRule routing_rules = 13;
}

message ListClientProvidersRequest  { string client_id = 1; }
message ListClientProvidersResponse { repeated ClientProvider providers = 1; }

message GetClientProviderRequest    { string id = 1; string client_id = 2; }

message UpdateClientProviderRequest {
  string id              = 1;
  string client_id       = 2;
  string name            = 3;
  string description     = 4;
  repeated string tags   = 5;
  string host            = 6;
  int32  port            = 7;
  string system_id       = 8;
  string password        = 9;
  int32  bind_type       = 10;
  int32  window_size     = 11;
  int32  max_connections = 12;
  int32  tps_limit       = 13;
  repeated RoutingRule routing_rules = 14;
}

message DeleteClientProviderRequest { string id = 1; string client_id = 2; }

message TestConnectionRequest {
  string host      = 1;
  int32  port      = 2;
  string system_id = 3;
  string password  = 4;
  int32  bind_type = 5;
}

message TestConnectionResponse {
  bool            success    = 1;
  int64           latency_ms = 2;
  repeated string log        = 3;
  string          error      = 4;
}
