syntax = "proto3";

package auth.v1;

option go_package = "github.com/smpp-server/smpp-server/api/proto/authv1";

import "google/protobuf/timestamp.proto";

// AuthService предоставляет методы для аутентификации и авторизации
service AuthService {
  // Authenticate выполняет аутентификацию пользователя
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);
  
  // ValidateToken проверяет валидность токена
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  
  // RefreshToken обновляет токен доступа
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  
  // GetPermissions получает права доступа пользователя
  rpc GetPermissions(GetPermissionsRequest) returns (GetPermissionsResponse);
  
  // CreateAPIKey создает новый API ключ
  rpc CreateAPIKey(CreateAPIKeyRequest) returns (CreateAPIKeyResponse);
  
  // RevokeAPIKey отзывает API ключ
  rpc RevokeAPIKey(RevokeAPIKeyRequest) returns (RevokeAPIKeyResponse);
  
  // ListAPIKeys получает список API ключей пользователя
  rpc ListAPIKeys(ListAPIKeysRequest) returns (ListAPIKeysResponse);

  // SetupTOTP генерирует TOTP секрет, возвращает секрет + QR URI + коды восстановления
  rpc SetupTOTP(SetupTOTPRequest) returns (SetupTOTPResponse);

  // VerifyTOTP проверяет TOTP код для включения 2FA
  rpc VerifyTOTP(VerifyTOTPRequest) returns (VerifyTOTPResponse);

  // DisableTOTP отключает 2FA (требует пароль)
  rpc DisableTOTP(DisableTOTPRequest) returns (DisableTOTPResponse);

  // RequestPasswordReset генерирует токен сброса пароля
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);

  // ResetPassword сбрасывает пароль по токену
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);

  // LoginWithSession выполняет аутентификацию и создает сессию (вместо JWT)
  rpc LoginWithSession(LoginWithSessionRequest) returns (LoginWithSessionResponse);

  // ValidateSession проверяет валидность сессии
  rpc ValidateSession(ValidateSessionRequest) returns (ValidateSessionResponse);

  // Logout уничтожает сессию
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // RegisterClient регистрирует нового клиента (public self-service)
  rpc RegisterClient(RegisterClientRequest) returns (RegisterClientResponse);
}

// AuthenticateRequest представляет запрос на аутентификацию
message AuthenticateRequest {
  string username = 1;        // Имя пользователя или email
  string password = 2;        // Пароль
  string api_key = 3;         // API ключ (альтернатива username/password)
}

// AuthenticateResponse представляет ответ на аутентификацию
message AuthenticateResponse {
  string access_token = 1;          // JWT токен доступа
  string refresh_token = 2;         // Refresh токен
  google.protobuf.Timestamp expires_at = 3;  // Время истечения токена
  UserInfo user = 4;                // Информация о пользователе
}

// ValidateTokenRequest представляет запрос на валидацию токена
message ValidateTokenRequest {
  string token = 1;           // JWT токен или API ключ
}

// ValidateTokenResponse представляет ответ на валидацию токена
message ValidateTokenResponse {
  bool valid = 1;             // Валидность токена
  UserInfo user = 2;          // Информация о пользователе (если токен валиден)
  string error = 3;           // Ошибка (если токен невалиден)
}

// RefreshTokenRequest представляет запрос на обновление токена
message RefreshTokenRequest {
  string refresh_token = 1;   // Refresh токен
}

// RefreshTokenResponse представляет ответ на обновление токена
message RefreshTokenResponse {
  string access_token = 1;          // Новый JWT токен доступа
  string refresh_token = 2;         // Новый refresh токен
  google.protobuf.Timestamp expires_at = 3;  // Время истечения токена
}

// GetPermissionsRequest представляет запрос на получение прав доступа
message GetPermissionsRequest {
  string user_id = 1;         // ID пользователя
}

// GetPermissionsResponse представляет ответ с правами доступа
message GetPermissionsResponse {
  repeated Permission permissions = 1;  // Список прав доступа
  Role role = 2;                       // Роль пользователя
}

// CreateAPIKeyRequest представляет запрос на создание API ключа
message CreateAPIKeyRequest {
  string user_id = 1;         // ID пользователя
  string name = 2;            // Название ключа
  google.protobuf.Timestamp expires_at = 3;  // Время истечения (опционально)
  repeated string scopes = 4; // Права доступа (опционально)
  repeated string allowed_ips = 5; // Разрешенные IP адреса (опционально)
}

// CreateAPIKeyResponse представляет ответ на создание API ключа
message CreateAPIKeyResponse {
  string api_key = 1;         // Созданный API ключ
  string api_key_id = 2;      // ID ключа
  google.protobuf.Timestamp created_at = 3;  // Время создания
  google.protobuf.Timestamp expires_at = 4;  // Время истечения
}

// RevokeAPIKeyRequest представляет запрос на отзыв API ключа
message RevokeAPIKeyRequest {
  string api_key_id = 1;      // ID ключа для отзыва
}

// RevokeAPIKeyResponse представляет ответ на отзыв API ключа
message RevokeAPIKeyResponse {
  bool success = 1;           // Успешность операции
}

// ListAPIKeysRequest представляет запрос на получение списка API ключей
message ListAPIKeysRequest {
  string user_id = 1;         // ID пользователя
}

// ListAPIKeysResponse представляет ответ со списком API ключей
message ListAPIKeysResponse {
  repeated APIKeyInfo keys = 1;  // Список API ключей
}

// UserInfo представляет информацию о пользователе
message UserInfo {
  string id = 1;              // ID пользователя
  string username = 2;        // Имя пользователя
  string email = 3;           // Email
  Role role = 4;              // Роль пользователя
  bool active = 5;            // Активен ли пользователь
  google.protobuf.Timestamp created_at = 6;  // Время создания
}

// Role представляет роль пользователя
message Role {
  string id = 1;              // ID роли
  string name = 2;            // Название роли (admin, client, operator)
  string description = 3;     // Описание роли
}

// Permission представляет право доступа
message Permission {
  string id = 1;              // ID права
  string resource = 2;        // Ресурс (messages, clients, providers, etc.)
  string action = 3;          // Действие (read, write, delete, etc.)
}

// APIKeyInfo представляет информацию об API ключе
message APIKeyInfo {
  string id = 1;              // ID ключа
  string name = 2;            // Название ключа
  string prefix = 3;          // Префикс ключа (для безопасности)
  bool active = 4;            // Активен ли ключ
  google.protobuf.Timestamp created_at = 5;  // Время создания
  google.protobuf.Timestamp expires_at = 6;  // Время истечения
  google.protobuf.Timestamp last_used_at = 7;  // Время последнего использования
  repeated string scopes = 8; // Права доступа
  repeated string allowed_ips = 9; // Разрешенные IP адреса
}

// SetupTOTPRequest представляет запрос на настройку TOTP
message SetupTOTPRequest {
  string user_id = 1;         // ID пользователя
}

// SetupTOTPResponse представляет ответ на настройку TOTP
message SetupTOTPResponse {
  string secret = 1;                    // TOTP секрет
  string qr_code_url = 2;              // URL для QR кода
  repeated string recovery_codes = 3;  // Коды восстановления
}

// VerifyTOTPRequest представляет запрос на проверку TOTP кода
message VerifyTOTPRequest {
  string user_id = 1;         // ID пользователя
  string totp_code = 2;       // TOTP код
}

// VerifyTOTPResponse представляет ответ на проверку TOTP кода
message VerifyTOTPResponse {
  bool success = 1;            // Успешность проверки
  bool totp_enabled = 2;      // Включен ли TOTP
}

// DisableTOTPRequest представляет запрос на отключение 2FA
message DisableTOTPRequest {
  string user_id = 1;         // ID пользователя
  string password = 2;        // Пароль для подтверждения
}

// DisableTOTPResponse представляет ответ на отключение 2FA
message DisableTOTPResponse {
  bool success = 1;            // Успешность операции
}

// RequestPasswordResetRequest представляет запрос на сброс пароля
message RequestPasswordResetRequest {
  string email = 1;           // Email пользователя
}

// RequestPasswordResetResponse представляет ответ на запрос сброса пароля
message RequestPasswordResetResponse {
  bool success = 1;            // Всегда true для предотвращения перечисления
  string reset_token = 2;     // Токен сброса (для отправки по email)
}

// ResetPasswordRequest представляет запрос на установку нового пароля
message ResetPasswordRequest {
  string token = 1;           // Токен сброса пароля
  string new_password = 2;    // Новый пароль
}

// ResetPasswordResponse представляет ответ на установку нового пароля
message ResetPasswordResponse {
  bool success = 1;            // Успешность операции
}

// LoginWithSessionRequest представляет запрос на аутентификацию с созданием сессии
message LoginWithSessionRequest {
  string email = 1;            // Email пользователя
  string password = 2;        // Пароль
  string totp_code = 3;       // TOTP код (опционально, для 2FA)
  string ip_address = 4;      // IP адрес клиента
  string user_agent = 5;      // User-Agent клиента
}

// LoginWithSessionResponse представляет ответ на аутентификацию с сессией
message LoginWithSessionResponse {
  string session_id = 1;      // ID сессии
  UserInfo user = 2;          // Информация о пользователе
  bool requires_2fa = 3;      // Требуется ли 2FA
  string login_ticket = 4;    // Временный тикет для 2FA потока
}

// ValidateSessionRequest представляет запрос на валидацию сессии
message ValidateSessionRequest {
  string session_id = 1;      // ID сессии
}

// ValidateSessionResponse представляет ответ на валидацию сессии
message ValidateSessionResponse {
  bool valid = 1;              // Валидность сессии
  UserInfo user = 2;          // Информация о пользователе
  string client_id = 3;       // ID клиента
}

// LogoutRequest представляет запрос на выход (уничтожение сессии)
message LogoutRequest {
  string session_id = 1;      // ID сессии
}

// LogoutResponse представляет ответ на выход
message LogoutResponse {
  bool success = 1;            // Успешность операции
}

// RegisterClientRequest представляет запрос на регистрацию нового клиента
message RegisterClientRequest {
  string email = 1;            // Email пользователя и клиента
  string password = 2;         // Пароль
  string company_name = 3;     // Название компании
  string contact_person = 4;   // Контактное лицо
  string phone = 5;            // Телефон
  string plan_name = 6;        // Имя тарифного плана: "free", "starter", "business", "pro"
}

// RegisterClientResponse представляет ответ на регистрацию клиента
message RegisterClientResponse {
  string client_id = 1;        // ID созданного клиента
  string user_id = 2;          // ID созданного пользователя
  string session_id = 3;       // ID сессии (авто-логин)
  UserInfo user = 4;           // Информация о пользователе
}
