// api/proto/template/template.proto
syntax = "proto3";

package template.v1;

option go_package = "github.com/smpp-server/smpp-server/api/proto/templatev1";

import "google/protobuf/timestamp.proto";

service TemplateService {
  rpc CreateTemplate(CreateTemplateRequest) returns (CreateTemplateResponse);
  rpc UpdateTemplate(UpdateTemplateRequest) returns (UpdateTemplateResponse);
  rpc DeleteTemplate(DeleteTemplateRequest) returns (DeleteTemplateResponse);
  rpc GetTemplate(GetTemplateRequest) returns (GetTemplateResponse);
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);
  rpc ApproveTemplate(ApproveTemplateRequest) returns (ApproveTemplateResponse);
  rpc RejectTemplate(RejectTemplateRequest) returns (RejectTemplateResponse);
  rpc RenderTemplate(RenderTemplateRequest) returns (RenderTemplateResponse);
  rpc GetTemplateAuditLog(GetTemplateAuditLogRequest) returns (GetTemplateAuditLogResponse);
  rpc AssignReviewer(AssignReviewerRequest) returns (AssignReviewerResponse);
  rpc RequestRevision(RequestRevisionRequest) returns (RequestRevisionResponse);
  rpc SubmitForReview(SubmitForReviewRequest) returns (SubmitForReviewResponse);
}

message CreateTemplateRequest {
  string client_id = 1;
  string name = 2;
  string body = 3;
  optional string sender_name_id = 4;
  string traffic_type = 5;
}

message CreateTemplateResponse {
  TemplateInfo template = 1;
}

message UpdateTemplateRequest {
  string id = 1;
  string client_id = 2;
  optional string name = 3;
  optional string body = 4;
  optional string traffic_type = 5;
}

message UpdateTemplateResponse {
  TemplateInfo template = 1;
}

message DeleteTemplateRequest {
  string id = 1;
  string client_id = 2;
}

message DeleteTemplateResponse {
  bool success = 1;
}

message GetTemplateRequest {
  string id = 1;
  string client_id = 2;
}

message GetTemplateResponse {
  TemplateInfo template = 1;
}

message ListTemplatesRequest {
  string client_id = 1;
  string status = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ListTemplatesResponse {
  repeated TemplateInfo templates = 1;
  int32 total = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ApproveTemplateRequest {
  string id = 1;
  string actor_id = 2;
}

message ApproveTemplateResponse {
  TemplateInfo template = 1;
}

message RejectTemplateRequest {
  string id = 1;
  string actor_id = 2;
  string reason = 3;
}

message RejectTemplateResponse {
  TemplateInfo template = 1;
}

message RenderTemplateRequest {
  string template_id = 1;
  string client_id = 2;
  map<string, string> variables = 3;
}

message RenderTemplateResponse {
  string rendered_text = 1;
  string template_name = 2;
}

message GetTemplateAuditLogRequest {
  string template_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetTemplateAuditLogResponse {
  repeated AuditEntry entries = 1;
  int32 total = 2;
}

message TemplateInfo {
  string id = 1;
  string client_id = 2;
  string name = 3;
  string body = 4;
  repeated string variables = 5;
  string status = 6;
  string rejection_reason = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string reviewer_id = 10;
  string review_comment = 11;
  google.protobuf.Timestamp reviewed_at = 12;
  string sender_name_id = 13;
  string sender_name = 14;
  string traffic_type = 15;
}

message AuditEntry {
  string id = 1;
  string template_id = 2;
  string action = 3;
  string old_body = 4;
  string new_body = 5;
  string actor_id = 6;
  string actor_type = 7;
  string reason = 8;
  google.protobuf.Timestamp created_at = 9;
}

message AssignReviewerRequest {
  string template_id = 1;
  string reviewer_id = 2;
}

message AssignReviewerResponse {
  TemplateInfo template = 1;
}

message RequestRevisionRequest {
  string template_id = 1;
  string reviewer_id = 2;
  string comment = 3;
}

message RequestRevisionResponse {
  TemplateInfo template = 1;
}

message SubmitForReviewRequest {
  string template_id = 1;
  string client_id = 2;
}

message SubmitForReviewResponse {
  TemplateInfo template = 1;
}
