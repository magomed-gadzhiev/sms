# Grafana Dashboard Provisioning Contract
# Файл: deployments/configs/grafana/provisioning/dashboards/dashboards.yml
#
# Определяет файловый провайдер для автоматической загрузки дашбордов

apiVersion: 1

providers:
  - name: SMS Gateway Dashboards
    orgId: 1
    folder: ''
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
